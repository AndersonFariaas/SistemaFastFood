<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Lanchonete • Cardápio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cardapio">
    <header class="topbar">
        <div><strong>🍔 Lanchonete</strong><span class="muted">Gerenciamento</span></div>
        <nav><a href="index.html">Caixa</a><a href="cozinha.html">Cozinha</a><a class="active"
                href="cardapio.html">Cardápio</a><a href="pedidos.html">Pedidos</a></nav>
    </header>
    <main class="page">
        <div class="section-head">
            <div>
                <h1>Cardápio</h1>
                <p>Crie categorias e cadastre quantos itens quiser.</p>
            </div><button id="novoProduto" class="btn primary">+ Novo item</button>
        </div>
        <div class="toolbar"><input id="filtroCardapio" class="search" placeholder="Buscar produto..."><select
                id="filtroCategoria">
                <option value="">Todas as categorias</option>
            </select></div>
        <div id="tabelaProdutos" class="table-wrap"></div>
    </main>
    <div id="modal" class="modal hidden">
        <form id="produtoForm" class="modal-card">
            <div class="section-head">
                <h2 id="modalTitulo">Novo item</h2><button type="button" id="fecharModal" class="icon">×</button>
            </div><input type="hidden" id="produtoId"><label>Nome<input id="produtoNome"
                    required></label><label>Preço<input id="produtoPreco" type="number" min="0" step="0.01"
                    required></label><label>Categoria<input id="produtoCategoria" placeholder="Ex.: Hambúrgueres"
                    required></label><label>Descrição<input id="produtoDescricao" placeholder="Opcional"></label><label
                class="check"><input id="produtoAtivo" type="checkbox" checked> Disponível no caixa</label>
            <div class="form-actions"><button type="button" id="cancelar" class="btn ghost">Cancelar</button><button
                    class="btn primary">Salvar item</button></div>
        </form>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script src="js/cardapio.js"></script>
</body>

</html>
